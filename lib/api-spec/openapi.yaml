openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LeadSprint operator console API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Operator session
  - name: dashboard
    description: Operator overview and activity
  - name: leads
    description: Lead intake and qualification
  - name: calls
    description: Call logs and safe call initiation
  - name: appointments
    description: Verified appointments
  - name: settings
    description: Business configuration
  - name: reports
    description: Weekly reports and usage
  - name: agents
    description: AI agent management and Retell sync
  - name: phone-numbers
    description: Phone number management and agent binding
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check provider readiness
      parameters:
        - name: x-leadsprint-market
          in: header
          schema:
            type: string
            enum: [US, IN]
            default: US
      responses:
        "200":
          description: Non-secret readiness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Database is unreachable; provider configuration is still reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current operator
      responses:
        "200":
          description: Current operator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the operator session
      responses:
        "204":
          description: Session ended
  /today:
    get:
      operationId: getToday
      tags: [dashboard]
      summary: Get the operator overview
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Today"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent operator activity
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 20
            default: 8
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, qualified, booked, closed, suppressed]
        - name: score
          in: query
          schema:
            type: string
            enum: [hot, warm, cold]
      responses:
        "200":
          description: Lead list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
  /leads/import:
    post:
      operationId: importLeads
      tags: [leads]
      summary: Import leads from normalized CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead qualification or follow-up
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}/suppress:
    post:
      operationId: suppressLead
      tags: [leads]
      summary: Suppress a lead from future calls
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuppressionInput"
      responses:
        "200":
          description: Suppressed lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /calls:
    get:
      operationId: getCalls
      tags: [calls]
      summary: List recent calls
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [created, policy_blocked, queued, provider_requesting, provider_accepted, in_progress, completed, failed, uncertain]
      responses:
        "200":
          description: Call list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
  /calls/start:
    post:
      operationId: startCall
      tags: [calls]
      summary: Safely queue a call for a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCallInput"
      responses:
        "201":
          description: Queued call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get a call detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Call detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
  /calls/{id}/retry:
    post:
      operationId: retryCall
      tags: [calls]
      summary: Retry an uncertain, failed or policy-blocked call
      description: >-
        Recovery action for a call whose provider state is uncertain. Queues a
        fresh attempt for the same lead; the safety policy gate runs again, so a
        retry can still be blocked.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "409":
          description: Retry was queued but not started (policy or setup)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          $ref: "#/components/responses/NotFound"
  /appointments/availability:
    post:
      operationId: getAvailability
      tags: [appointments]
      summary: Get confirmed calendar availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
  /appointments/book:
    post:
      operationId: bookAppointment
      tags: [appointments]
      summary: Book and verify an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Verified appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments:
    get:
      operationId: getAppointments
      tags: [appointments]
      summary: List verified appointments
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
  /onboarding/checklist:
    get:
      operationId: getOnboardingChecklist
      tags: [settings]
      summary: Pilot setup checklist and live-calling readiness
      responses:
        "200":
          description: Checklist state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingChecklist"
  /business-settings:
    get:
      operationId: getBusinessSettings
      tags: [settings]
      summary: Get business configuration
      responses:
        "200":
          description: Business configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    patch:
      operationId: updateBusinessSettings
      tags: [settings]
      summary: Update business configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSettingsUpdate"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
  /reports/weekly:
    get:
      operationId: getWeeklyReport
      tags: [reports]
      summary: Get the weekly pilot report
      responses:
        "200":
          description: Weekly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"
  /usage:
    get:
      operationId: getUsage
      tags: [reports]
      summary: Get current period usage
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
  /webhooks/intake:
    post:
      operationId: receiveLeadIntake
      tags: [leads]
      summary: Receive a signed lead intake event
      responses:
        "201": { description: Lead accepted }
        "200": { description: Duplicate lead ignored }
        "401": { description: Invalid signature }
  /webhooks/retell:
    post:
      operationId: receiveRetellEvent
      tags: [calls]
      summary: Receive a signed Retell event
      responses:
        "202": { description: Event accepted or already processed }
        "401": { description: Invalid signature }
  /webhooks/twilio/status:
    post:
      operationId: receiveTwilioStatus
      tags: [calls]
      summary: Receive a Twilio call status callback
      responses:
        "202": { description: Event accepted or already processed }
        "401": { description: Invalid signature }
  /webhooks/calcom:
    post:
      operationId: receiveCalcomEvent
      tags: [appointments]
      summary: Receive a signed Cal.com booking event
      responses:
        "202": { description: Event accepted or already processed }
        "401": { description: Invalid signature }
  /orgs:
    get:
      operationId: listOrganizations
      tags: [orgs]
      summary: List organizations the authenticated user belongs to
      responses:
        "200":
          description: Organizations for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsResponse"
    post:
      operationId: createOrganization
      tags: [orgs]
      summary: Create a new organization workspace and become its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSwitchResponse"
        "400":
          description: Invalid organization request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/switch:
    post:
      operationId: switchOrganization
      tags: [orgs]
      summary: Switch active organization for the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
      responses:
        "200":
          description: Active organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSwitchResponse"
        "403":
          description: User is not a member of the requested organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team:
    get:
      operationId: getTeam
      tags: [team]
      summary: Get active organization team members, invitations, and caller permissions
      responses:
        "200":
          description: Team roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRosterResponse"
  /team/invitations:
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Create and send a team invitation for the active organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteTeamMemberRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteTeamMemberResult"
        "400":
          description: Invalid invitation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already belongs to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Invitation rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team/invitations/{invitationId}:
    delete:
      operationId: revokeTeamInvitation
      tags: [team]
      summary: Revoke a pending team invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitationResponse"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /team/invitations/accept:
    post:
      operationId: acceptTeamInvitation
      tags: [team]
      summary: Accept a team invitation as the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResponse"
        "400":
          description: Invalid or expired invitation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invitation email does not match authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User is already a member or invitation already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team/members/{membershipId}:
    patch:
      operationId: updateTeamMemberRole
      tags: [team]
      summary: Change the role of a team member
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRoleRequest"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberResponse"
        "400":
          description: Invalid role update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeTeamMember
      tags: [team]
      summary: Remove a member from the active organization
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveTeamMemberResult"
        "400":
          description: Cannot remove self or last owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /audit-logs:
    get:
      operationId: getAuditLogs
      tags: [team]
      summary: Get recent RBAC and workspace audit log entries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [security]
      summary: List scoped API keys for the active workspace (masked metadata only)
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createApiKey
      tags: [security]
      summary: Create a scoped per-tenant API key (raw secret returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResult"
        "400":
          description: Invalid API key request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-keys/{keyId}:
    delete:
      operationId: revokeApiKey
      tags: [security]
      summary: Revoke a tenant API key
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeApiKeyResult"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /credentials:
    get:
      operationId: listProviderCredentials
      tags: [security]
      summary: List encrypted provider credential status and masked hints (never plaintext secrets)
      responses:
        "200":
          description: Provider credential summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialListResponse"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /credentials/{provider}:
    put:
      operationId: upsertProviderCredentials
      tags: [security]
      summary: Encrypt and store per-tenant provider credentials with AES-256-GCM
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CredentialProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProviderCredentialsRequest"
      responses:
        "200":
          description: Provider credential saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertProviderCredentialResult"
        "400":
          description: Invalid credential payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: APP_ENCRYPTION_KEY is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProviderCredentials
      tags: [security]
      summary: Remove stored encrypted credentials for a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CredentialProvider"
      responses:
        "200":
          description: Provider credential deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProviderCredentialResult"
        "403":
          description: Insufficient role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Agents endpoints
  # ---------------------------------------------------------------------------
  /agents:
    get:
      operationId: getAgents
      tags: [agents]
      summary: List workspace agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentListResponse" }
    post:
      operationId: postAgents
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRequest" }
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateAgentResult" }
        "403":
          description: Insufficient role permissions
  /agents/retell/remote:
    get:
      operationId: getAgentsRetellRemote
      tags: [agents]
      summary: List agents in the connected Retell account
      responses:
        "200":
          description: Remote agent list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetellRemoteAgentListResponse" }
        "503":
          description: Retell not configured
  /agents/retell/voices:
    get:
      operationId: getAgentsRetellVoices
      tags: [agents]
      summary: List available Retell voices
      responses:
        "200":
          description: Voice list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetellVoiceListResponse" }
        "503":
          description: Retell not configured
  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAgentsAgentId
      tags: [agents]
      summary: Get agent detail
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetailResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAgentsAgentId
      tags: [agents]
      summary: Update agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateAgentResult" }
        "403":
          description: Insufficient role permissions
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgentsAgentId
      tags: [agents]
      summary: Delete agent
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAgentResult" }
        "403":
          description: Insufficient role permissions
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agentId}/publish:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postAgentsAgentIdPublish
      tags: [agents]
      summary: Publish agent to Retell and snapshot version
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishAgentResult" }
        "403":
          description: Insufficient role permissions
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agentId}/versions:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAgentsAgentIdVersions
      tags: [agents]
      summary: List published versions of an agent
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentVersionListResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agentId}/retell-link:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postAgentsAgentIdRetellLink
      tags: [agents]
      summary: Link an existing Retell agent to this workspace agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetellLinkRequest" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetellLinkResult" }
        "403":
          description: Insufficient role permissions
        "404":
          $ref: "#/components/responses/NotFound"
  /agents/{agentId}/test-web-call:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postAgentsAgentIdTestWebCall
      tags: [agents]
      summary: Create a Retell web-call sandbox test
      responses:
        "200":
          description: Web-call created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebCallResult" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Retell not configured

  # ---------------------------------------------------------------------------
  # Phone numbers endpoints
  # ---------------------------------------------------------------------------
  /phone-numbers:
    get:
      operationId: getPhoneNumbers
      tags: [phone-numbers]
      summary: List workspace phone numbers
      responses:
        "200":
          description: Phone number list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneNumberListResponse" }
  /phone-numbers/sync:
    post:
      operationId: postPhoneNumbersSync
      tags: [phone-numbers]
      summary: Sync phone numbers from Retell into this workspace
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneNumberSyncResult" }
        "503":
          description: Retell not configured
  /phone-numbers/{phoneNumberId}:
    parameters:
      - name: phoneNumberId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: patchPhoneNumbersPhoneNumberId
      tags: [phone-numbers]
      summary: Update phone number nickname or agent binding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePhoneNumberRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatePhoneNumberResult" }
        "403":
          description: Insufficient role permissions
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
        mode: { type: string, enum: [live, demo] }
        market: { type: string, enum: [US, IN] }
        providers:
          type: object
          properties:
            retell: { type: boolean }
            twilio: { type: boolean }
            calcom: { type: boolean }
            intake: { type: boolean }
          required: [retell, twilio, calcom, intake]
        auth: { type: string, enum: [clerk, demo, unconfigured] }
      required: [status, database, mode, market, providers, auth]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OrgRole:
      type: string
      enum: [owner, admin, manager, member]
    OrganizationSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: ["string", "null"] }
        vertical: { $ref: "#/components/schemas/VerticalId" }
        role: { $ref: "#/components/schemas/OrgRole" }
        is_active: { type: boolean }
      required: [id, name, slug, vertical, role, is_active]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, manager, member, operator] }
      required: [id, name, email, role]
    Business:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        market: { type: string, enum: [US, IN] }
        timezone: { type: string }
        phone_number: { type: string }
        transfer_number: { type: string }
        recording_disclosure: { type: boolean }
        ai_disclosure: { type: boolean }
        quiet_hours: { type: string }
        max_call_attempts: { type: number }
        suppression_enabled: { type: boolean }
        vertical: { $ref: "#/components/schemas/VerticalId" }
      required: [id, name, market, timezone, phone_number, transfer_number, recording_disclosure, ai_disclosure, quiet_hours, max_call_attempts, suppression_enabled, vertical]
    VerticalId:
      type: string
      enum: [real_estate, home_services]
    ProfileFieldOption:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
      required: [value, label]
    ProfileField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, enum] }
        options: { type: array, items: { $ref: "#/components/schemas/ProfileFieldOption" } }
        in_list: { type: boolean }
        storage: { type: string, enum: [column, details] }
      required: [key, label, type, options, in_list, storage]
    VerticalProfile:
      type: object
      description: The industry profile of a workspace. The console renders lead fields, urgency and appointment wording from this instead of hard-coding one industry.
      properties:
        id: { $ref: "#/components/schemas/VerticalId" }
        label: { type: string }
        appointment_label: { type: string }
        urgency_levels: { type: array, items: { $ref: "#/components/schemas/ProfileFieldOption" } }
        fields: { type: array, items: { $ref: "#/components/schemas/ProfileField" } }
      required: [id, label, appointment_label, urgency_levels, fields]
    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        business: { $ref: "#/components/schemas/Business" }
        profile: { $ref: "#/components/schemas/VerticalProfile" }
        active_role: { $ref: "#/components/schemas/OrgRole" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationSummary" }
      required: [user, business, profile]
    Score:
      type: string
      enum: [hot, warm, cold]
    Lead:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        preferred_language: { type: string }
        source: { type: string }
        campaign: { type: string }
        project: { type: string }
        property_type: { type: string }
        budget_min: { type: ["number", "null"] }
        budget_max: { type: ["number", "null"] }
        budget_label: { type: string }
        location: { type: string }
        timeline: { type: string }
        qualification_status: { type: string }
        intent_score: { type: number, minimum: 0, maximum: 100 }
        score: { $ref: "#/components/schemas/Score" }
        next_action: { type: string }
        status: { type: string, enum: [new, contacted, qualified, booked, closed, suppressed] }
        suppressed: { type: boolean }
        last_call: { type: ["string", "null"] }
        created_at: { type: string }
        consent_status: { $ref: "#/components/schemas/ConsentStatus" }
        consent_source: { type: ["string", "null"] }
        consent_at: { type: ["string", "null"] }
        consent_detail: { type: string }
        callable: { type: boolean }
        details:
          type: object
          description: Industry-specific answers keyed by the workspace profile's fields (service type, problem, ZIP...). Empty for real estate.
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
        urgency: { type: ["string", "null"] }
        consent_evidence: { type: ["string", "null"] }
      required: [id, name, phone, email, preferred_language, source, campaign, project, property_type, budget_label, location, timeline, qualification_status, intent_score, score, next_action, status, suppressed, last_call, created_at, consent_status, consent_source, consent_at, consent_detail, callable, details, urgency, consent_evidence]
    ConsentStatus:
      type: string
      enum: [unknown, valid, revoked]
    ChecklistItem:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        complete: { type: boolean }
        severity: { type: string, enum: [required, recommended] }
        detail: { type: string }
      required: [key, label, complete, severity, detail]
    OnboardingChecklist:
      type: object
      properties:
        ready_for_live_calls: { type: boolean }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        missing_required:
          type: array
          items: { type: string }
      required: [ready_for_live_calls, items, missing_required]
    LeadUpdate:
      type: object
      properties:
        status: { type: string, enum: [new, contacted, qualified, booked, closed, suppressed] }
        next_action: { type: string }
        qualification_status: { type: string }
    SuppressionInput:
      type: object
      properties:
        reason: { type: string }
    LeadImportInput:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LeadImportRow"
        consent_status: { $ref: "#/components/schemas/ConsentStatus" }
        consent_source:
          type: string
          description: Where and how consent was captured for this batch. Required when consent_status is "valid".
        consent_at: { type: string, format: date-time }
        dnd_status: { $ref: "#/components/schemas/DndStatus" }
        consent_category: { $ref: "#/components/schemas/ConsentCategory" }
      required: [rows]
    LeadImportRow:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        source: { type: string }
        campaign: { type: string }
        project: { type: string }
        location: { type: string }
        property_type: { type: string }
        budget_label: { type: string }
        timeline: { type: string }
      required: [name, phone]
    ImportResult:
      type: object
      properties:
        imported: { type: number }
        skipped: { type: number }
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required: [imported, skipped, leads]
    Call:
      type: object
      properties:
        id: { type: string }
        lead_id: { type: string }
        lead_name: { type: string }
        phone: { type: string }
        provider: { type: string }
        status: { type: string, enum: [queued, in_progress, completed, failed, uncertain, policy_blocked] }
        started_at: { type: ["string", "null"] }
        ended_at: { type: ["string", "null"] }
        duration_seconds: { type: ["number", "null"] }
        summary: { type: string }
        outcome: { type: string }
        transferred: { type: boolean }
        booked: { type: boolean }
        error_state: { type: ["string", "null"] }
      required: [id, lead_id, lead_name, phone, provider, status, started_at, ended_at, duration_seconds, summary, outcome, transferred, booked, error_state]
    StartCallInput:
      type: object
      properties:
        lead_id: { type: string }
      required: [lead_id]
    Appointment:
      type: object
      properties:
        id: { type: string }
        lead_id: { type: string }
        lead_name: { type: string }
        service_or_property: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        timezone: { type: string }
        calendar_provider: { type: string }
        external_id: { type: string }
        status: { type: string, enum: [confirmed, cancelled, needs_review] }
      required: [id, lead_id, lead_name, service_or_property, start_time, end_time, timezone, calendar_provider, external_id, status]
    AvailabilityInput:
      type: object
      properties:
        lead_id: { type: string }
        date: { type: string, format: date }
      required: [lead_id, date]
    Slot:
      type: object
      properties:
        start_time: { type: string }
        end_time: { type: string }
        label: { type: string }
      required: [start_time, end_time, label]
    AppointmentInput:
      type: object
      properties:
        lead_id: { type: string }
        slot_start: { type: string, format: date-time }
        slot_end: { type: string, format: date-time }
      required: [lead_id, slot_start, slot_end]
    Activity:
      type: object
      properties:
        id: { type: string }
        type:
          {
            type: string,
            enum: [lead, call, booking, alert, import, intake, message, policy],
          }
        title: { type: string }
        detail: { type: string }
        created_at: { type: string }
      required: [id, type, title, detail, created_at]
    Today:
      type: object
      properties:
        date_label: { type: string }
        metrics:
          type: object
          properties:
            new_leads: { type: number }
            calls_in_progress: { type: number }
            hot_leads: { type: number }
            appointments_today: { type: number }
            failed_calls: { type: number }
            unresolved_messages: { type: number }
          required: [new_leads, calls_in_progress, hot_leads, appointments_today, failed_calls, unresolved_messages]
        setup_warnings:
          type: array
          items: { type: string }
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required: [date_label, metrics, setup_warnings, upcoming, recent_activity]
    BusinessSettings:
      allOf:
        - $ref: "#/components/schemas/Business"
        - type: object
          properties:
            project_name: { type: string }
            services_or_property_types: { type: array, items: { type: string } }
            approved_faq: { type: string }
            qualification_questions: { type: array, items: { type: string } }
            escalation_rules: { type: string }
            cal_event_type_id: { type: ["string", "null"] }
            retell_agent_id: { type: ["string", "null"] }
            notify_email: { type: ["string", "null"] }
            service_area_zips: { type: array, items: { type: string } }
            pricing_policy: { type: ["string", "null"] }
          required: [project_name, services_or_property_types, approved_faq, qualification_questions, escalation_rules, cal_event_type_id, retell_agent_id, notify_email, service_area_zips, pricing_policy]
    BusinessSettingsUpdate:
      type: object
      properties:
        market: { type: string, enum: [US, IN] }
        timezone: { type: string }
        transfer_number: { type: string }
        project_name: { type: string }
        approved_faq: { type: string }
        qualification_questions: { type: array, items: { type: string } }
        recording_disclosure: { type: boolean }
        ai_disclosure: { type: boolean }
        quiet_hours: { type: string }
        max_call_attempts: { type: number, minimum: 1, maximum: 10 }
        vertical: { $ref: "#/components/schemas/VerticalId" }
        notify_email: { type: ["string", "null"], maxLength: 254 }
        service_area_zips:
          type: array
          maxItems: 200
          items: { type: string, pattern: "^[0-9]{3,5}$" }
        pricing_policy: { type: ["string", "null"], maxLength: 500 }
    WeeklyReport:
      type: object
      properties:
        period_label: { type: string }
        leads_received: { type: number }
        calls_attempted: { type: number }
        calls_connected: { type: number }
        qualified_leads: { type: number }
        appointments_booked: { type: number }
        transfer_rate: { type: number }
        failed_actions: { type: number }
        voice_minutes: { type: number }
        estimated_provider_cost: { type: number }
      required: [period_label, leads_received, calls_attempted, calls_connected, qualified_leads, appointments_booked, transfer_rate, failed_actions, voice_minutes, estimated_provider_cost]
    Usage:
      type: object
      properties:
        period_label: { type: string }
        voice_minutes: { type: number }
        included_minutes: { type: number }
        sms_count: { type: number }
        booking_count: { type: number }
        estimated_cost: { type: number }
      required: [period_label, voice_minutes, included_minutes, sms_count, booking_count, estimated_cost]
    OrganizationsResponse:
      type: object
      properties:
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationSummary" }
        active_business_id: { type: string }
        active_role: { $ref: "#/components/schemas/OrgRole" }
      required: [organizations, active_business_id, active_role]
    CreateOrganizationRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        vertical: { $ref: "#/components/schemas/VerticalId" }
        market: { type: string, enum: [US, IN] }
        timezone: { type: string }
      required: [name]
    SwitchOrganizationRequest:
      type: object
      properties:
        business_id: { type: string, minLength: 1 }
      required: [business_id]
    OrganizationSwitchResponse:
      type: object
      properties:
        active_business_id: { type: string }
        active_role: { $ref: "#/components/schemas/OrgRole" }
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
      required: [active_business_id, active_role, organization]
    TeamPermissions:
      type: object
      properties:
        can_invite: { type: boolean }
        allowed_invite_roles:
          type: array
          items: { $ref: "#/components/schemas/OrgRole" }
        can_manage_roles: { type: boolean }
        can_remove_members: { type: boolean }
        can_edit_settings: { type: boolean }
      required: [can_invite, allowed_invite_roles, can_manage_roles, can_remove_members, can_edit_settings]
    TeamMember:
      type: object
      properties:
        membership_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        joined_at: { type: string, format: date-time }
        last_login_at: { type: ["string", "null"], format: date-time }
      required: [membership_id, user_id, name, email, role, joined_at, last_login_at]
    TeamInvitation:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invited_by_user_id: { type: string }
        invited_by_name: { type: ["string", "null"] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, email, role, status, invited_by_user_id, invited_by_name, expires_at, created_at]
    TeamRosterResponse:
      type: object
      properties:
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        current_user_id: { type: string }
        current_role: { $ref: "#/components/schemas/OrgRole" }
        permissions: { $ref: "#/components/schemas/TeamPermissions" }
        members:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
        invitations:
          type: array
          items: { $ref: "#/components/schemas/TeamInvitation" }
      required: [organization, current_user_id, current_role, permissions, members, invitations]
    InviteTeamMemberRequest:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 320 }
        role: { $ref: "#/components/schemas/OrgRole" }
      required: [email, role]
    InviteTeamMemberResult:
      type: object
      properties:
        invitation: { $ref: "#/components/schemas/TeamInvitation" }
        delivery_status: { type: string, enum: [sent, smtp_unconfigured, demo_logged] }
      required: [invitation, delivery_status]
    TeamInvitationResponse:
      type: object
      properties:
        invitation: { $ref: "#/components/schemas/TeamInvitation" }
      required: [invitation]
    AcceptInvitationRequest:
      type: object
      properties:
        token: { type: string, minLength: 16, maxLength: 512 }
      required: [token]
    AcceptInvitationResponse:
      type: object
      properties:
        accepted: { type: boolean }
        membership:
          type: object
          properties:
            id: { type: string }
            business_id: { type: string }
            role: { $ref: "#/components/schemas/OrgRole" }
          required: [id, business_id, role]
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
      required: [accepted, membership, organization]
    UpdateTeamMemberRoleRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/OrgRole" }
      required: [role]
    TeamMemberResponse:
      type: object
      properties:
        member: { $ref: "#/components/schemas/TeamMember" }
      required: [member]
    RemoveTeamMemberResult:
      type: object
      properties:
        removed_membership_id: { type: string }
      required: [removed_membership_id]
    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        business_id: { type: ["string", "null"] }
        user_id: { type: ["string", "null"] }
        actor_name: { type: ["string", "null"] }
        actor_email: { type: ["string", "null"] }
        entity: { type: string }
        entity_id: { type: ["string", "null"] }
        action: { type: string }
        details: { type: ["object", "null"], additionalProperties: true }
        created_at: { type: string, format: date-time }
      required: [id, business_id, user_id, actor_name, actor_email, entity, entity_id, action, details, created_at]
    AuditLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
      required: [logs]
    DndStatus:
      type: string
      enum: [unknown, clear, registered]
    ConsentCategory:
      type: string
      enum: [inquiry, transactional, promotional]
    ApiKeySummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        last_used_at: { type: ["string", "null"], format: date-time }
        expires_at: { type: ["string", "null"], format: date-time }
        revoked_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, name, key_prefix, scopes, last_used_at, expires_at, revoked_at, created_at]
    ApiKeyListResponse:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ApiKeySummary" }
      required: [keys]
    CreateApiKeyRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        scopes:
          type: array
          items: { type: string }
        expires_in_days: { type: number, minimum: 1, maximum: 365 }
      required: [name]
    CreateApiKeyResult:
      type: object
      properties:
        api_key: { $ref: "#/components/schemas/ApiKeySummary" }
        secret_key: { type: string }
      required: [api_key, secret_key]
    RevokeApiKeyResult:
      type: object
      properties:
        revoked_key_id: { type: string }
        revoked_at: { type: string, format: date-time }
      required: [revoked_key_id, revoked_at]
    CredentialProvider:
      type: string
      enum: [retell, twilio, calcom, intake]
    ProviderCredentialSummary:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/CredentialProvider" }
        configured: { type: boolean }
        key_version: { type: ["number", "null"] }
        masked_hints:
          type: object
          additionalProperties: { type: string }
        updated_at: { type: ["string", "null"], format: date-time }
      required: [provider, configured, key_version, masked_hints, updated_at]
    ProviderCredentialListResponse:
      type: object
      properties:
        encryption_configured: { type: boolean }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/ProviderCredentialSummary" }
      required: [encryption_configured, credentials]
    UpsertProviderCredentialsRequest:
      type: object
      properties:
        config:
          type: object
          additionalProperties: { type: string }
      required: [config]
    UpsertProviderCredentialResult:
      type: object
      properties:
        credential: { $ref: "#/components/schemas/ProviderCredentialSummary" }
      required: [credential]
    DeleteProviderCredentialResult:
      type: object
      properties:
        deleted_provider: { $ref: "#/components/schemas/CredentialProvider" }
      required: [deleted_provider]

    # -------------------------------------------------------------------------
    # Phase 3 — Agents & Phone Numbers
    # -------------------------------------------------------------------------
    AgentStatus:
      type: string
      enum: [draft, active, paused]
    AgentUseCase:
      type: string
      enum: [real_estate, home_services, insurance, mortgage, general]
    AgentSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        use_case: { $ref: "#/components/schemas/AgentUseCase" }
        status: { $ref: "#/components/schemas/AgentStatus" }
        voice_id: { type: [string, "null"] }
        language: { type: [string, "null"] }
        retell_agent_id: { type: [string, "null"] }
        calls_today: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      required: [id, name, use_case, status, calls_today, created_at]
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          properties:
            system_prompt: { type: [string, "null"] }
            greeting_message: { type: [string, "null"] }
            fallback_message: { type: [string, "null"] }
            temperature: { type: [number, "null"] }
            retell_llm_id: { type: [string, "null"] }
    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentSummary" }
      required: [agents]
    AgentDetailResponse:
      type: object
      properties:
        agent: { $ref: "#/components/schemas/AgentDetail" }
      required: [agent]
    CreateAgentRequest:
      type: object
      properties:
        name: { type: string }
        use_case: { $ref: "#/components/schemas/AgentUseCase" }
        system_prompt: { type: string }
        greeting_message: { type: string }
        fallback_message: { type: string }
        voice_id: { type: string }
        language: { type: string }
        temperature: { type: number }
        create_retell: { type: boolean, default: false }
      required: [name, use_case]
    UpdateAgentRequest:
      type: object
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/AgentStatus" }
        system_prompt: { type: string }
        greeting_message: { type: string }
        fallback_message: { type: string }
        voice_id: { type: string }
        language: { type: string }
        temperature: { type: number }
    CreateAgentResult:
      type: object
      properties:
        agent: { $ref: "#/components/schemas/AgentDetail" }
      required: [agent]
    UpdateAgentResult:
      type: object
      properties:
        agent: { $ref: "#/components/schemas/AgentDetail" }
      required: [agent]
    DeleteAgentResult:
      type: object
      properties:
        deleted_id: { type: string }
      required: [deleted_id]
    PublishAgentResult:
      type: object
      properties:
        version_number: { type: [number, "null"] }
        published_at: { type: string, format: date-time }
      required: [published_at]
    AgentVersionSummary:
      type: object
      properties:
        id: { type: string }
        version_number: { type: number }
        published_by: { type: string }
        published_at: { type: string, format: date-time }
        notes: { type: [string, "null"] }
      required: [id, version_number, published_by, published_at]
    AgentVersionListResponse:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/AgentVersionSummary" }
      required: [versions]
    RetellRemoteAgent:
      type: object
      properties:
        retell_agent_id: { type: string }
        agent_name: { type: string }
        voice_id: { type: string }
        language: { type: string }
        last_modification_timestamp: { type: number }
      required: [retell_agent_id, agent_name, voice_id, language, last_modification_timestamp]
    RetellRemoteAgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/RetellRemoteAgent" }
      required: [agents]
    RetellLinkRequest:
      type: object
      properties:
        retell_agent_id: { type: string }
        retell_llm_id: { type: string }
      required: [retell_agent_id]
    RetellLinkResult:
      type: object
      properties:
        agent: { $ref: "#/components/schemas/AgentDetail" }
      required: [agent]
    RetellVoiceSummary:
      type: object
      properties:
        voice_id: { type: string }
        voice_name: { type: string }
        provider: { type: string }
        accent: { type: [string, "null"] }
        gender: { type: [string, "null"] }
        age: { type: [string, "null"] }
        preview_audio_url: { type: [string, "null"] }
      required: [voice_id, voice_name, provider]
    RetellVoiceListResponse:
      type: object
      properties:
        voices:
          type: array
          items: { $ref: "#/components/schemas/RetellVoiceSummary" }
      required: [voices]
    WebCallResult:
      type: object
      properties:
        access_token: { type: string }
        call_id: { type: string }
      required: [access_token, call_id]
    PhoneNumberSummary:
      type: object
      properties:
        id: { type: string }
        e164_number: { type: string }
        nickname: { type: [string, "null"] }
        inbound_agent_id: { type: [string, "null"] }
        outbound_agent_id: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, e164_number, is_active, created_at]
    PhoneNumberListResponse:
      type: object
      properties:
        phone_numbers:
          type: array
          items: { $ref: "#/components/schemas/PhoneNumberSummary" }
      required: [phone_numbers]
    PhoneNumberSyncResult:
      type: object
      properties:
        synced: { type: number }
        phone_numbers:
          type: array
          items: { $ref: "#/components/schemas/PhoneNumberSummary" }
      required: [synced, phone_numbers]
    UpdatePhoneNumberRequest:
      type: object
      properties:
        nickname: { type: string }
        inbound_agent_id: { type: [string, "null"] }
        outbound_agent_id: { type: [string, "null"] }
    UpdatePhoneNumberResult:
      type: object
      properties:
        phone_number: { $ref: "#/components/schemas/PhoneNumberSummary" }
      required: [phone_number]


